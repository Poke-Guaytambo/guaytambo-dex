name: Error (bug)
description: Algo no funciona como debería
title: "fix: "
labels: ["tipo: bug", "estado: por triar"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué ocurre?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Godot y sistema operativo
      placeholder: "Godot 4.7.2 – Windows 11"
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Capturas, GIF o salida de consola
